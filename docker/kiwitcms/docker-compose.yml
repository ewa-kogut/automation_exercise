# Kiwi TCMS – local test case management.
# Based on https://github.com/kiwitcms/Kiwi/blob/master/docker-compose.yml
# Changes: ports moved to 8000/8443 (443 is used by ReportPortal), test-only proxy removed,
# DB passwords can be overridden in a git-ignored .env file next to this file.
#
# Start:  docker compose -p kiwitcms up -d
# Setup:  docker exec -it kiwi_web /Kiwi/manage.py initial_setup   (first run only)
# Open:   https://localhost:8443
services:
    db:
        container_name: kiwi_db
        image: mariadb:latest
        command:
            --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
        volumes:
            - db_data:/var/lib/mysql
        restart: always
        environment:
            MYSQL_ROOT_PASSWORD: ${KIWI_DB_ROOT_PASSWORD:-kiwi-1s-aw3s0m3}
            MYSQL_DATABASE: kiwi
            MYSQL_USER: kiwi
            MYSQL_PASSWORD: ${KIWI_DB_PASSWORD:-kiwi}

    web:
        container_name: kiwi_web
        depends_on:
            - db
        restart: always
        image: pub.kiwitcms.eu/kiwitcms/kiwi:latest
        ports:
            - 8000:8080
            - 8443:8443
        volumes:
            - uploads:/Kiwi/uploads:Z
        environment:
            KIWI_DB_HOST: db
            KIWI_DB_PORT: 3306
            KIWI_DB_NAME: kiwi
            KIWI_DB_USER: kiwi
            KIWI_DB_PASSWORD: ${KIWI_DB_PASSWORD:-kiwi}
        cap_drop:
          - ALL

volumes:
    db_data:
    uploads:
