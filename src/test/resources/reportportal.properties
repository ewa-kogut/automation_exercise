# ReportPortal agent settings. Each value can be overridden with -D<key> or an environment
# variable (rp.api.key -> RP_API_KEY). The API key is a secret: never put it in this file.
#
# Off by default, so a run without ReportPortal works as before.
# To send results: set RP_ENABLE=true and RP_API_KEY=<key from ReportPortal: Profile -> API Keys>.
rp.enable=false
rp.endpoint=http://localhost:8090
rp.project=superadmin_personal
rp.launch=automation-exercise
rp.description=UI and API tests for https://automationexercise.com
