# Runs all tests on every pull request into main or develop, on every push to them, and on demand
# from the Actions tab. Pull requests from forks are skipped: a fork gets no secrets, so tests that
# log in would fail, and the secrets stay away from code that nobody has reviewed yet.
name: Tests

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

# One run per branch at a time: a new run (push or manual) cancels the older run that is still
# going on the same branch, because the newer one tests the newer code.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    # Pull requests from forks get no secrets (see the comment at the top).
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      # Config key "remote": there is no screen here, so the browser runs headless.
      REMOTE: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # One rerun, because the site sometimes answers HTTP 503 when it is overloaded.
      # Reports and screenshots are not uploaded: screenshots can show the test account's email,
      # and anyone with a GitHub account can download the files of a public repository's runs.
      - name: Run tests
        run: ./mvnw -B test -Dreruns=1
