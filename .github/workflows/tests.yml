# Runs all tests on every push to main or develop, and on demand from the Actions tab.
# Pull requests are left out on purpose: a pull request from a fork gets no secrets, so tests that
# log in would fail, and this also keeps the secrets away from code that nobody has reviewed yet.
name: Tests

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      # Config key "remote": there is no screen here, so the browser runs headless.
      REMOTE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # One rerun, because the site sometimes answers HTTP 503 when it is overloaded.
      # Reports and screenshots are not uploaded: screenshots can show the test account's email,
      # and anyone with a GitHub account can download the files of a public repository's runs.
      - name: Run tests
        run: ./mvnw -B test -Dreruns=1
